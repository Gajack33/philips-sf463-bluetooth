name: Offline verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SF463_COMPILER: clang-18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - name: Install pinned analysis dependencies
        run: python -m pip install -r requirements-analysis.txt
      - name: Complete offline C, Thumb and companion verification
        run: |
          clang-18 --version
          export JAVA_HOME="${JAVA_HOME_21_X64:?The runner must provide its existing JDK 21}"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          python firmware/verify.py --compiler clang-18 --java-home "$JAVA_HOME" --out "$RUNNER_TEMP/sf463-verification"
